<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPM</title>
  <style>
    body { width: 320px; min-height: 200px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #0f0f0f; color: #f0f0f0; }
    h2 { font-size: 14px; margin: 0 0 10px; color: #f97316; }
    .item { padding: 8px; border-radius: 6px; background: #1a1a1a; margin-bottom: 6px; font-size: 12px; }
    .item-username { font-weight: 600; color: #f97316; }
    .item-stats { color: #aaa; margin-top: 2px; }
    .item-url { color: #666; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { color: #666; font-size: 12px; text-align: center; padding: 24px 0; }
    a { color: #f97316; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>📊 Social Post Monitor Pro</h2>
  <div id="list"><div class="empty">No posts tracked yet.<br>Visit an Instagram or Facebook post.</div></div>
  <script src="popup.js"></script>
</body>
</html>
